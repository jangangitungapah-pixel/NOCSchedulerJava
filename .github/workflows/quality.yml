name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-and-tests:
    name: Static, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime policy
        run: npm run check:runtime

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Repository policy
        run: npm run check:repo

      - name: Workspace boundaries
        run: npm run check:workspaces

      - name: Firebase Spark architecture safety
        run: npm run check:firebase

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dead code and dependency sanity
        run: npm run check:deadcode

  browser-smoke:
    name: Chromium E2E and accessibility
    needs: static-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Chromium scaffold E2E
        run: npm run test:e2e:ci

      - name: Accessibility smoke
        run: npm run test:a11y
