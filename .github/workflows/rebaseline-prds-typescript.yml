name: Rebaseline PRDs to TypeScript and TSX

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebaseline-prds-typescript.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebaseline all PRDs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('docs/prd')
          files = sorted(root.glob('PRD-*.md'))
          canonical_note = '> **Canonical Technology Baseline:** TypeScript strict mode + TSX + React + Vite + Tailwind CSS + Node.js/TypeScript API + Firebase managed platform. For any platform-specific conflict, PRD-22 is authoritative.'

          for path in files:
              text = path.read_text(encoding='utf-8')

              # Repository identity is now NOCSchedulerJava everywhere.
              text = text.replace('`jangangitungapah-pixel/NOCScheduler`', '`jangangitungapah-pixel/NOCSchedulerJava`')

              # Old platform precedence references now point to PRD-22.
              text = text.replace(
                  '**PRD-21 — Firebase Platform Architecture Amendment**',
                  '**PRD-22 — TypeScript, TSX, Node.js, Vite, Tailwind & Firebase Managed Platform Rebaseline**'
              )
              text = text.replace(
                  'PRD-21 — Firebase Platform Architecture Amendment',
                  'PRD-22 — TypeScript, TSX, Node.js, Vite, Tailwind & Firebase Managed Platform Rebaseline'
              )

              # Make the active stack explicit in every PRD without changing business semantics.
              if canonical_note not in text:
                  lines = text.splitlines()
                  if lines and lines[0].startswith('# '):
                      lines.insert(1, '')
                      lines.insert(2, canonical_note)
                      text = '\n'.join(lines)
                      if not text.endswith('\n'):
                          text += '\n'

              path.write_text(text, encoding='utf-8')

          # PRD-22 becomes the canonical TypeScript/TSX rebaseline instead of JavaScript/JSX.
          old = root / 'PRD-22_JavaScript_Node_Vite_Tailwind_Firebase_Platform_Rebaseline.md'
          new = root / 'PRD-22_TypeScript_TSX_Node_Vite_Tailwind_Firebase_Platform_Rebaseline.md'
          if old.exists():
              text = old.read_text(encoding='utf-8')
              replacements = {
                  '# PRD-22 — JavaScript, Node.js, Vite, Tailwind & Firebase Managed Platform Rebaseline': '# PRD-22 — TypeScript, TSX, Node.js, Vite, Tailwind & Firebase Managed Platform Rebaseline',
                  '> **Frontend Language:** JavaScript / JSX': '> **Frontend Language:** TypeScript / TSX — strict mode',
                  '> **Backend Language:** JavaScript / Node.js': '> **Backend Language:** TypeScript / Node.js — strict mode',
                  'JavaScript + React + Vite + Tailwind CSS frontend and JavaScript + Node.js backend': 'TypeScript + React + Vite + Tailwind CSS frontend and TypeScript + Node.js backend',
                  'React SPA written in JavaScript/JSX': 'React SPA written in TypeScript/TSX',
                  '+ Node.js API written in JavaScript': '+ Node.js API written in TypeScript',
                  '| Source language | JavaScript ESM + JSX; no TypeScript source requirement |': '| Source language | TypeScript ESM + TSX — strict mode |',
                  '| Frontend | React |': '| Frontend | React + TypeScript/TSX |',
                  '| React compiler pipeline | Vite React SWC plugin or equivalent supported fast compiler |': '| React compiler pipeline | Vite React SWC TypeScript/TSX pipeline or equivalent supported compiler |',
                  'shared/server JavaScript domain modules': 'shared/server TypeScript domain modules',
                  'server-authoritatively in JavaScript': 'server-authoritatively in TypeScript',
                  'implemented in JavaScript domain/server modules': 'implemented in TypeScript domain/server modules',
                  'Node.js API on managed Firebase/Google Cloud runtime': 'Node.js/TypeScript API on managed Firebase/Google Cloud runtime',
                  'JavaScript / JSX': 'TypeScript / TSX',
                  'JavaScript/JSX': 'TypeScript/TSX',
                  'JavaScript + Node.js': 'TypeScript + Node.js',
                  'JavaScript domain': 'TypeScript domain',
                  'JavaScript implementation': 'TypeScript implementation',
                  'JavaScript source': 'TypeScript source',
                  'JavaScript runtime modules': 'TypeScript source modules compiled to JavaScript runtime modules',
                  'JSDoc/`checkJs`': 'TypeScript strict checking with `tsc --noEmit`',
                  '`checkJs`': '`tsc --noEmit`',
                  '.jsx': '.tsx',
              }
              for a, b in replacements.items():
                  text = text.replace(a, b)

              # Explicit source/runtime rule.
              marker = '# 3. Architecture Decision Summary'
              rule = '''# 2.2 TypeScript source and runtime rule\n\nAll first-party application source code is TypeScript. React files use `.tsx`; non-React modules use `.ts`. Plain `.js`/`.jsx` application source is not part of the canonical architecture, except unavoidable tool-generated/vendor configuration where the selected tool does not support TypeScript.\n\nVite and the Node.js build pipeline compile/transpile TypeScript to JavaScript for browser/server execution. Therefore TypeScript improves authoring safety without requiring browsers to execute TypeScript directly.\n\nRequired compiler posture:\n\n- `strict: true`;\n- `noUncheckedIndexedAccess: true` where compatible with the codebase;\n- `exactOptionalPropertyTypes: true` where practical;\n- `noImplicitOverride: true` when class inheritance is used;\n- `useUnknownInCatchVariables: true`;\n- `tsc --noEmit` is a required CI quality gate;\n- avoid `any`; use `unknown` plus narrowing when external input is not yet validated;\n- Zod remains required at runtime boundaries because TypeScript types disappear at runtime.\n\n---\n\n'''
              if '# 2.2 TypeScript source and runtime rule' not in text and marker in text:
                  text = text.replace(marker, rule + marker)

              new.write_text(text, encoding='utf-8')
              old.unlink()

          # README/index must point to the TypeScript/TSX canonical baseline.
          readme = root / 'README.md'
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              reps = {
                  'PRD-22 — JavaScript, Node.js, Vite, Tailwind & Firebase Managed Platform Rebaseline': 'PRD-22 — TypeScript, TSX, Node.js, Vite, Tailwind & Firebase Managed Platform Rebaseline',
                  'PRD-22 JavaScript, Node.js, Vite, Tailwind & Firebase Platform Rebaseline': 'PRD-22 TypeScript, TSX, Node.js, Vite, Tailwind & Firebase Platform Rebaseline',
                  'JavaScript / JSX': 'TypeScript / TSX',
                  'JavaScript\n  React': 'TypeScript / TSX\n  React',
                  'Backend\n  JavaScript\n  Node.js': 'Backend\n  TypeScript\n  Node.js',
                  'The active application source language is **JavaScript**.': 'The active application source language is **TypeScript**. React source uses **`.tsx`** and non-React source uses **`.ts`**.',
                  'JavaScript domain/server modules': 'TypeScript domain/server modules',
                  'server-authoritative JavaScript implementation': 'server-authoritative TypeScript implementation',
              }
              for a, b in reps.items():
                  text = text.replace(a, b)
              readme.write_text(text, encoding='utf-8')

          # PRD-21 is historical, but its replacement direction must name the active TS stack.
          p21 = root / 'PRD-21_Firebase_Platform_Architecture_Amendment.md'
          if p21.exists():
              text = p21.read_text(encoding='utf-8')
              text = text.replace(
                  'PRD-22 — JavaScript, Node.js, Vite, Tailwind & Firebase Managed Platform Rebaseline',
                  'PRD-22 — TypeScript, TSX, Node.js, Vite, Tailwind & Firebase Managed Platform Rebaseline'
              )
              text = text.replace('React + JavaScript SPA', 'React + TypeScript/TSX SPA')
              text = text.replace('Node.js API', 'Node.js/TypeScript API')
              p21.write_text(text, encoding='utf-8')

          # Update common implementation terminology in affected technical PRDs without changing product rules.
          technical = {
              'PRD-14_Technical_Architecture_Technology_Stack.md': [
                  ('Next.js 16+ App Router', 'React + Vite frontend; Node.js/TypeScript API backend'),
                  ('Next.js Application', 'React/Vite Frontend + Node.js/TypeScript API'),
                  ('Next.js App Router', 'React Router + Vite application routing'),
                  ('Server Components', 'API-backed route/page loaders and TanStack Query server-state'),
                  ('Client Components', 'React components'),
                  ('Route Handlers / API', 'Node.js/TypeScript HTTP API'),
                  ('Route Handlers', 'Node.js/TypeScript API routes'),
                  ('Server Actions', 'typed API commands'),
                  ('selected Next.js release', 'selected React/Vite release'),
              ],
              'PRD-15_API_Backend_Contract.md': [
                  ('Route Handler', 'Node.js/TypeScript route/controller'),
                  ('route handler', 'Node.js/TypeScript route/controller'),
              ],
              'PRD-16_Authentication_Security_Data_Integrity.md': [
                  ('security guidance resmi Better Auth', 'security guidance resmi Firebase Authentication'),
                  ('security guidance resmi Next.js untuk deployment yang digunakan', 'security guidance resmi Vite, Node.js, Firebase Hosting, Cloud Functions, dan Firebase Authentication untuk deployment yang digunakan'),
              ],
              'PRD-20_Deployment_Operations_Backup_Observability.md': [
                  ('NOCScheduler Next.js Modular Monolith', 'NOCScheduler React/Vite frontend + managed Node.js/TypeScript API'),
                  ('Server Components', 'React SPA routes'),
                  ('Route Handlers / API', 'Node.js/TypeScript API'),
                  ('Better Auth', 'Firebase Authentication'),
                  ('Managed PostgreSQL', 'Cloud Firestore'),
                  ('PostgreSQL', 'Cloud Firestore'),
                  ('selected Next.js release', 'selected Node.js/TypeScript runtime'),
              ],
          }
          for filename, reps in technical.items():
              path = root / filename
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for a, b in reps:
                  text = text.replace(a, b)
              path.write_text(text, encoding='utf-8')

          # No active PRD may advertise JS/JSX as the canonical source language.
          for path in sorted(root.glob('PRD-*.md')):
              text = path.read_text(encoding='utf-8')
              text = text.replace('Frontend Language:** JavaScript / JSX', 'Frontend Language:** TypeScript / TSX — strict mode')
              text = text.replace('Backend Language:** JavaScript / Node.js', 'Backend Language:** TypeScript / Node.js — strict mode')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify canonical PRD baseline
        shell: bash
        run: |
          test -f docs/prd/PRD-22_TypeScript_TSX_Node_Vite_Tailwind_Firebase_Platform_Rebaseline.md
          test ! -f docs/prd/PRD-22_JavaScript_Node_Vite_Tailwind_Firebase_Platform_Rebaseline.md
          grep -q 'TypeScript / TSX' docs/prd/README.md
          grep -q 'TypeScript / TSX' docs/prd/PRD-22_TypeScript_TSX_Node_Vite_Tailwind_Firebase_Platform_Rebaseline.md
          for f in docs/prd/PRD-*.md; do
            grep -q 'Canonical Technology Baseline' "$f"
          done

      - name: Remove migration workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/rebaseline-prds-typescript.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'docs: standardize PRDs on TypeScript and TSX'
          git push origin HEAD:main
