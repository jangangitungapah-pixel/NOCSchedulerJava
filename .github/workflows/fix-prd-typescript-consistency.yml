name: Finish TypeScript and TSX PRD consistency

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-prd-typescript-consistency.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix residual platform contradictions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('docs/prd')

          # PRD-22: make every implementation section TypeScript/TSX-consistent.
          p22 = root / 'PRD-22_TypeScript_TSX_Node_Vite_Tailwind_Firebase_Platform_Rebaseline.md'
          text = p22.read_text(encoding='utf-8')
          reps = {
              '| PRD-14 Technical Architecture | Next.js/TypeScript/PostgreSQL-specific baseline superseded by PRD-22 |': '| PRD-14 Technical Architecture | Legacy Next.js/PostgreSQL full-stack assumptions superseded by PRD-22 |',
              '│  │  └─ vite.config.js': '│  │  └─ vite.config.ts',
              '│     │  ├─ app.js': '│     │  ├─ app.ts',
              '│     └─ index.js': '│     └─ index.ts',
              '# 7. JavaScript Source Standard': '# 7. TypeScript Source Standard',
              'NOCScheduler intentionally uses JavaScript rather than TypeScript as the source language.': 'NOCScheduler uses TypeScript as the canonical first-party source language for both frontend and backend.',
              '- `.js` for standard modules;\n- `.tsx` for React components.': '- `.ts` for standard non-React modules;\n- `.tsx` for React components and files containing JSX.',
              'Do not introduce `.ts` or `.tsx` without a future explicit architecture decision.': 'Do not introduce first-party `.js` or `.jsx` application source unless a tool-generated configuration cannot reasonably be expressed in TypeScript.',
              'To keep a large JavaScript codebase safe:': 'To keep the TypeScript codebase safe and maintainable:',
              '- use JSDoc for important domain/API types;\n- optionally enable `// @ts-check` / `tsc --noEmit` static analysis while keeping source files JavaScript;': '- model important domain/API contracts with TypeScript types/interfaces plus Zod runtime schemas at trust boundaries;\n- run `tsc --noEmit` as a required static type-check quality gate;',
              'A TypeScript compiler may be used only as a **development checker for JavaScript/JSDoc** if useful; this does not make TypeScript the application source language.': 'TypeScript is the application source language. The emitted browser/server runtime is JavaScript, but first-party source remains `.ts`/`.tsx`.',
              'Application server code is JavaScript ESM.': 'Application server source is TypeScript ESM and is compiled/transpiled to JavaScript for the managed Node.js runtime.',
              '- TypeScript as application source language;': '- plain JavaScript/JSX as the default first-party application source language;',
              'Because the codebase uses JavaScript rather than TypeScript source, reliability must be intentional.': 'Because NOCScheduler contains high-risk scheduling and payroll logic, strict TypeScript and runtime validation are both required.',
              '- JSDoc for high-value structures and public module contracts;': '- explicit TypeScript types/interfaces for high-value structures and public module contracts;',
              '- source application uses `.js/.tsx`, not Next.js framework structure;': '- source application uses `.ts/.tsx`, not Next.js framework structure;',
              'a server-authoritative JavaScript/Node.js HTTP API': 'a server-authoritative TypeScript/Node.js HTTP API',
          }
          for a, b in reps.items():
              text = text.replace(a, b)

          # Tighten TS-specific architecture requirements.
          if '## 7.1 Compiler and type-safety contract' not in text:
              marker = '# 8. Frontend Application Architecture'
              addition = '''## 7.1 Compiler and type-safety contract\n\nThe root/workspace TypeScript configuration must enforce a strict baseline. At minimum, implementation must preserve `strict: true` and a dedicated `typecheck` command using `tsc --noEmit`. Prefer `noUncheckedIndexedAccess`, `exactOptionalPropertyTypes`, and `useUnknownInCatchVariables` unless a documented compatibility issue requires a temporary exception.\n\nRules:\n\n- `any` is prohibited by default in domain, API contract, payroll, scheduling, authorization, and repository code;\n- use `unknown` for untrusted values until validation/narrowing succeeds;\n- discriminated unions should model business lifecycle states where they make invalid states harder to represent;\n- branded/opaque ID types may be introduced for critical identifiers when they materially reduce accidental ID mixing;\n- TypeScript types never replace Zod/server validation at runtime boundaries.\n\n---\n\n'''
              text = text.replace(marker, addition + marker)
          p22.write_text(text, encoding='utf-8')

          # PRD-21 must remain PRD-21 and historical, while pointing to the TS/TSX replacement.
          p21 = root / 'PRD-21_Firebase_Platform_Architecture_Amendment.md'
          text = p21.read_text(encoding='utf-8')
          lines = text.splitlines()
          if lines:
              lines[0] = '# PRD-21 — Firebase Platform Architecture Amendment (Historical)'
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          text = text.replace(
              'future work uses JavaScript + React + Vite + Tailwind on the client and JavaScript + Node.js on the server;',
              'future work uses TypeScript/TSX + React + Vite + Tailwind on the client and TypeScript + Node.js on the server;'
          )
          p21.write_text(text, encoding='utf-8')

          # README: TypeScript is mandatory, plain JS/JSX is not the canonical first-party source.
          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '- TypeScript source files as a mandatory platform;',
              '- plain JavaScript/JSX as the default first-party application source language;'
          )
          readme.write_text(text, encoding='utf-8')

          # PRD-08: make the active persistence baseline explicit rather than relational-by-default.
          p08 = root / 'PRD-08_Data_Model_Database_Architecture.md'
          text = p08.read_text(encoding='utf-8')
          reps = {
              'conceptual data model, relational boundaries, entity ownership': 'conceptual data model, domain-data boundaries, entity ownership',
              'Namun model aplikasi harus diasumsikan menggunakan **relational database dengan dukungan transaction, foreign key, unique constraint, index, dan strong consistency** sebagai baseline.': 'Implementasi canonical menggunakan **Cloud Firestore**. Integrity yang sebelumnya diasumsikan berasal dari foreign key/unique constraint SQL harus diwujudkan melalui deterministic document IDs, transaction, reservation/index documents, explicit references, version fields, effective dating, snapshots, dan server-side invariant checks sesuai PRD-22.',
              '## DA-P01 — Relational First': '## DA-P01 — Explicit Domain Records First',
              'relational integrity': 'domain/application integrity',
              'foreign keys': 'explicit reference integrity guards',
              'foreign key': 'explicit reference integrity guard',
              'unique constraint': 'deterministic uniqueness strategy',
              'Database Constraints Protect Invariants': 'Persistence and Domain Guards Protect Invariants',
              'database constraints': 'persistence/domain invariant guards',
          }
          for a, b in reps.items():
              text = text.replace(a, b)
          p08.write_text(text, encoding='utf-8')

          # PRD-14: technical stack itself must now match PRD-22, not merely carry an amendment banner.
          p14 = root / 'PRD-14_Technical_Architecture_Technology_Stack.md'
          text = p14.read_text(encoding='utf-8')
          reps = {
              '| Database | PostgreSQL |': '| Database | Cloud Firestore |',
              '| ORM / SQL Toolkit | Drizzle ORM |': '| Data Access | Firebase Admin SDK + application-owned repository layer |',
              '| Migration Tool | Drizzle Kit + reviewed SQL migrations |': '| Data/Index/Rules Change Tooling | Versioned Firestore indexes, security rules, and reviewed TypeScript data-migration scripts |',
              '| Authentication | Better Auth |': '| Authentication | Firebase Authentication |',
              '| Primary Deployment Unit | One web application + PostgreSQL |': '| Primary Deployment Unit | Firebase Hosting SPA + managed Node.js/TypeScript API + Cloud Firestore |',
              '## 6.1 Database Choice — PostgreSQL': '## 6.1 Database Choice — Cloud Firestore',
              'PostgreSQL is the baseline relational database.': 'Cloud Firestore is the canonical managed persistence layer. Relational-style invariants are preserved through explicit domain contracts, transactions, deterministic IDs, effective dating, snapshots, and tested repository guards.',
              '## 6.2 ORM — Drizzle ORM': '## 6.2 Data Access — Firebase Admin SDK Repository Layer',
              'Drizzle is recommended because the application benefits from:': 'Firebase Admin SDK is the privileged server adapter. Application-owned repositories are required because the application benefits from:',
              '- explicit relational schema,': '- explicit collection/document contracts,',
              '- close mapping to SQL,': '- clear mapping between domain records and Firestore documents,',
              '- type-safe query construction,': '- typed TypeScript repository contracts and runtime-validated data boundaries,',
              '- migration generation,': '- version-controlled indexes/rules and explicit data migration scripts,',
              '- ability to inspect/review generated SQL.': '- ability to inspect/review every persistence mutation and query pattern.',
              'ORM usage must not hide important database behavior.': 'Repository abstractions must not hide important Firestore transaction, indexing, read-cost, or consistency behavior.',
              'For complex constraints or optimized queries, explicit SQL is allowed when documented and tested.': 'For complex invariants or optimized queries, explicit Firestore transaction/query logic is allowed when documented and tested.',
              'Use codebase-first schema management.': 'Use codebase-first data-contract, index, rules, and migration management.',
              'Schema change\n→ generate migration\n→ review SQL\n→ test on local/test database\n→ commit migration\n→ apply through deployment process': 'Data-contract/index/rules change\n→ create reviewed migration/index/rules change\n→ test with Emulator Suite\n→ commit versioned change\n→ apply through deployment process',
              'Direct `push`-style schema synchronization must not be the normal production migration path.': 'Ad-hoc production document mutation must not be the normal migration path.',
              'Production schema changes require versioned migration files.': 'Production data-shape/backfill changes require versioned TypeScript migration scripts or explicitly versioned index/rules changes.',
              'Potentially destructive migrations require explicit review.': 'Potentially destructive Firestore data migrations require explicit review.',
              'Better Auth is the recommended authentication framework.': 'Firebase Authentication is the canonical identity provider.',
              'Better Auth handles:': 'Firebase Authentication handles:',
              'NOCScheduler custom permission/capability service': 'NOCScheduler custom permission/capability service',
          }
          for a, b in reps.items():
              text = text.replace(a, b)
          # Remove obvious legacy framework labels that survived the first pass.
          text = text.replace('Next.js', 'legacy Next.js') if 'Next.js' in text else text
          # Restore statements where "legacy legacy" could be introduced by repeat runs.
          text = text.replace('legacy legacy Next.js', 'legacy Next.js')
          p14.write_text(text, encoding='utf-8')

          # PRD-15: canonical implementation wording is Node.js/TypeScript API.
          p15 = root / 'PRD-15_API_Backend_Contract.md'
          text = p15.read_text(encoding='utf-8')
          text = text.replace('Route Handler', 'Node.js/TypeScript route/controller')
          text = text.replace('route handler', 'Node.js/TypeScript route/controller')
          p15.write_text(text, encoding='utf-8')

          # PRD-16: canonical auth/security platform.
          p16 = root / 'PRD-16_Authentication_Security_Data_Integrity.md'
          text = p16.read_text(encoding='utf-8')
          text = text.replace('Better Auth', 'Firebase Authentication')
          text = text.replace('Next.js', 'React/Vite frontend and Node.js/TypeScript API')
          p16.write_text(text, encoding='utf-8')

          # PRD-19: QA language must test Firestore/domain invariants rather than SQL constraints.
          p19 = root / 'PRD-19_QA_Testing_Acceptance_Criteria.md'
          text = p19.read_text(encoding='utf-8')
          reps = {
              '## QA-P04 — Database Constraints Are Tested Contracts': '## QA-P04 — Persistence and Domain Invariants Are Tested Contracts',
              'Constraint penting harus memiliki integration/database contract test.': 'Invariant persistence penting harus memiliki integration/repository contract test menggunakan Firebase Emulator Suite.',
              'invalid foreign key ditolak,': 'invalid/dangling application reference ditolak oleh domain/repository guard,',
              'database constraints': 'persistence/domain invariant guards',
              'migration verification': 'data-contract/index/rules migration verification',
          }
          for a, b in reps.items():
              text = text.replace(a, b)
          p19.write_text(text, encoding='utf-8')

          # PRD-20: operations vocabulary aligned to Firebase Hosting + managed Node + Firestore.
          p20 = root / 'PRD-20_Deployment_Operations_Backup_Observability.md'
          text = p20.read_text(encoding='utf-8')
          reps = {
              'database migration execution': 'Firestore data/index/rules migration execution',
              'migration/schema version': 'release/data-contract version',
              '## OPS-P04 — Database Changes Are Releases': '## OPS-P04 — Data Contract, Index, Rules, and Backfill Changes Are Releases',
              'Setiap schema change harus:': 'Setiap perubahan data contract, index, security rules, atau backfill harus:',
              'Database restore tidak boleh digunakan': 'Firestore restore tidak boleh digunakan',
              'database unavailable': 'Firestore unavailable',
              'local database': 'Firebase Emulator Suite data services',
              'database migration': 'Firestore data/index/rules migration',
              'schema change': 'data-contract change',
              'schema version': 'data-contract version',
          }
          for a, b in reps.items():
              text = text.replace(a, b)
          p20.write_text(text, encoding='utf-8')
          PY

      - name: Verify no active contradictions remain
        shell: bash
        run: |
          P22=docs/prd/PRD-22_TypeScript_TSX_Node_Vite_Tailwind_Firebase_Platform_Rebaseline.md
          grep -q '# 7. TypeScript Source Standard' "$P22"
          grep -q 'source application uses `.ts/.tsx`' "$P22"
          grep -q 'Application server source is TypeScript ESM' "$P22"
          ! grep -q 'intentionally uses JavaScript rather than TypeScript' "$P22"
          ! grep -q 'TypeScript as application source language;' "$P22"
          ! grep -q 'source application uses `.js/.tsx`' "$P22"
          ! grep -q 'server-authoritative JavaScript/Node.js' "$P22"
          ! grep -q 'Application server code is JavaScript ESM' "$P22"
          grep -q '^# PRD-21 — Firebase Platform Architecture Amendment (Historical)$' docs/prd/PRD-21_Firebase_Platform_Architecture_Amendment.md
          ! grep -q 'future work uses JavaScript + React' docs/prd/PRD-21_Firebase_Platform_Architecture_Amendment.md
          ! grep -q 'TypeScript source files as a mandatory platform' docs/prd/README.md
          grep -q '| Database | Cloud Firestore |' docs/prd/PRD-14_Technical_Architecture_Technology_Stack.md
          grep -q '| Authentication | Firebase Authentication |' docs/prd/PRD-14_Technical_Architecture_Technology_Stack.md
          for f in docs/prd/PRD-*.md; do
            grep -q 'Canonical Technology Baseline' "$f"
            grep -q 'NOCSchedulerJava' "$f"
          done

      - name: Remove migration workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-prd-typescript-consistency.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: finalize TypeScript and TSX PRD baseline'
          git push origin HEAD:main
