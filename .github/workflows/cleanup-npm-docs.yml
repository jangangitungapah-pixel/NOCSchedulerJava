name: Clean npm workplan wording

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-npm-docs.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean wording
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('docs/workplan/WORKPLAN_NOCScheduler_Full_Production_v1.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('- `root package.json `workspaces` configuration`;', '- npm workspaces configured in root `package.json`;')
          text = text.replace('- aktifkan Corepack/npm workflow;', '- gunakan npm yang disertakan bersama Node.js dan tetapkan npm workspaces pada root `package.json`;')
          p.write_text(text, encoding='utf-8')
          PY
          grep -q 'npm workspaces configured in root' docs/workplan/WORKPLAN_NOCScheduler_Full_Production_v1.md
          grep -q 'npm yang disertakan bersama Node.js' docs/workplan/WORKPLAN_NOCScheduler_Full_Production_v1.md
      - name: Commit and self-remove
        shell: bash
        run: |
          rm -f .github/workflows/cleanup-npm-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: clean npm workspace guidance'
          git push origin HEAD:main
