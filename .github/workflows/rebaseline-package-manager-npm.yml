name: Rebaseline package manager to npm

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebaseline-package-manager-npm.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace pnpm baseline with npm workspaces
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = list(Path('docs').rglob('*.md'))
          replacements = [
              ('pnpm workspace modular monorepo', 'npm workspaces modular monorepo'),
              ('pnpm workspace', 'npm workspaces'),
              ('pnpm-workspace.yaml', 'root package.json `workspaces` configuration'),
              ('pnpm-lock.yaml', 'package-lock.json'),
              ('pinned pnpm lockfile', 'pinned package-lock.json'),
              ('pnpm lockfile', 'package-lock.json'),
              ('Package manager | pnpm', 'Package manager | npm'),
              ('Package Manager | pnpm', 'Package Manager | npm'),
              ('- pnpm;', '- npm;'),
              ('`pnpm install`', '`npm install`'),
              ('`pnpm typecheck`', '`npm run typecheck`'),
              ('`pnpm lint`', '`npm run lint`'),
              ('`pnpm format:check`', '`npm run format:check`'),
              ('`pnpm test:integration`', '`npm run test:integration`'),
              ('`pnpm test:e2e`', '`npm run test:e2e`'),
              ('`pnpm test:rules`', '`npm run test:rules`'),
              ('`pnpm test:visual`', '`npm run test:visual`'),
              ('`pnpm test:a11y`', '`npm run test:a11y`'),
              ('`pnpm test:security`', '`npm run test:security`'),
              ('`pnpm test:performance`', '`npm run test:performance`'),
              ('`pnpm test`', '`npm test`'),
              ('`pnpm build`', '`npm run build`'),
              ('`pnpm check:deadcode`', '`npm run check:deadcode`'),
              ('pnpm install', 'npm install'),
              ('pnpm typecheck', 'npm run typecheck'),
              ('pnpm lint', 'npm run lint'),
              ('pnpm format:check', 'npm run format:check'),
              ('pnpm test:integration', 'npm run test:integration'),
              ('pnpm test:e2e', 'npm run test:e2e'),
              ('pnpm test:rules', 'npm run test:rules'),
              ('pnpm test:visual', 'npm run test:visual'),
              ('pnpm test:a11y', 'npm run test:a11y'),
              ('pnpm test:security', 'npm run test:security'),
              ('pnpm test:performance', 'npm run test:performance'),
              ('pnpm test', 'npm test'),
              ('pnpm build', 'npm run build'),
              ('pnpm check:deadcode', 'npm run check:deadcode'),
              ('pnpm', 'npm'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Ensure PRD-22 explicitly documents npm workspaces.
          p22 = Path('docs/prd/PRD-22_TypeScript_TSX_Node_Vite_Tailwind_Firebase_Platform_Rebaseline.md')
          if p22.exists():
              text = p22.read_text(encoding='utf-8')
              text = text.replace('| Package manager | npm |', '| Package manager | npm |')
              text = text.replace('| Repository structure | npm workspaces modular monorepo |', '| Repository structure | npm workspaces modular monorepo |')
              text = text.replace('├─ root package.json `workspaces` configuration\n└─ package.json', '├─ package-lock.json\n└─ package.json  # root npm workspaces configuration')
              p22.write_text(text, encoding='utf-8')

          # Add explicit workflow decision note.
          workflow = Path('docs/workflow/WORKFLOW_Chat_GitHub_Full_Automation_v1.md')
          if workflow.exists():
              text = workflow.read_text(encoding='utf-8')
              marker = '# 7. Branch and Commit Policy'
              note = '''# 6.1 Package Manager Rule\n\nCanonical package manager adalah **npm**. Gunakan npm workspaces melalui root `package.json`, simpan dependency lock pada `package-lock.json`, dan jangan membuat `pnpm-lock.yaml`, `pnpm-workspace.yaml`, atau mencampur pnpm/yarn ke workflow normal.\n\nCommand baseline:\n\n```text\nnpm install\nnpm run dev\nnpm run typecheck\nnpm run lint\nnpm test\nnpm run build\n```\n\n---\n\n'''
              if '# 6.1 Package Manager Rule' not in text and marker in text:
                  text = text.replace(marker, note + marker)
              workflow.write_text(text, encoding='utf-8')

          ledger = Path('docs/workflow/PHASE_CONTROL.md')
          if ledger.exists():
              text = ledger.read_text(encoding='utf-8')
              text = text.replace('| Blocking Issue | None |', '| Blocking Issue | None |\n| Package Manager Baseline | `npm` + npm workspaces + `package-lock.json` |')
              ledger.write_text(text, encoding='utf-8')
          PY

      - name: Verify npm-only documentation baseline
        shell: bash
        run: |
          if grep -Rni --include='*.md' 'pnpm' docs; then
            echo 'Residual pnpm references found.'
            exit 1
          fi
          grep -q 'Package manager | npm' docs/prd/PRD-22_TypeScript_TSX_Node_Vite_Tailwind_Firebase_Platform_Rebaseline.md
          grep -q 'npm workspaces' docs/prd/PRD-22_TypeScript_TSX_Node_Vite_Tailwind_Firebase_Platform_Rebaseline.md
          grep -q 'npm run typecheck' docs/workplan/WORKPLAN_NOCScheduler_Full_Production_v1.md
          grep -q 'Package Manager Rule' docs/workflow/WORKFLOW_Chat_GitHub_Full_Automation_v1.md

      - name: Remove migration workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/rebaseline-package-manager-npm.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'docs: standardize project workflow on npm'
          git push origin HEAD:main
